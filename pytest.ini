[pytest]

testpaths = tests

python_files = test_*.py

python_functions = test_*

addopts =
    -v
    --strict-markers

markers =
    smoke: Smoke Test - flujos básicos críticos (¿el sistema funciona?)
    sanity: Sanity Test - reglas de negocio y riesgos críticos
    xray(JIRA_ID): vincula el test con su caso en Jira Xray
