name: QA Regression Suite

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      suite:
        description: "Suite de pruebas a ejecutar"
        required: true
        default: regression
        type: choice
        options:
          - regression
          - smoke
          - sanity

jobs:

  regression:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Verify Allure Plugin
        run: |
          pytest --help | grep alluredir

      - name: Create Reports Folder
        run: |
          mkdir -p reports/allure-results

      - name: Start Mock API
        run: |
          nohup uvicorn mock_api.app:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Execute Test Suite
        env:
          # Xray Cloud credentials (Repository secrets). If they are not set
          # (e.g. pull requests from forks), tests run without publishing to Xray.
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_API_BASE_URL: ${{ vars.XRAY_API_BASE_URL || 'https://xray.cloud.getxray.app' }}
          # push / pull_request -> regression; manual runs -> the selected suite
          SUITE: ${{ inputs.suite || 'regression' }}
          XRAY_EXECUTION_REVISION: ${{ github.sha }}
        run: |
          case "$SUITE" in
            smoke)      MARK_ARGS="-m smoke";  SUITE_NAME="Smoke Test" ;;
            sanity)     MARK_ARGS="-m sanity"; SUITE_NAME="Sanity Test" ;;
            regression) MARK_ARGS="";          SUITE_NAME="Regresión" ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac
          echo "Running suite: $SUITE_NAME"
          export XRAY_EXECUTION_SUMMARY="Ejecución automatizada ($SUITE_NAME) - ${{ github.ref_name }} #${{ github.run_number }}"

          XRAY_ARGS=""
          if [ -n "$XRAY_CLIENT_ID" ] && [ -n "$XRAY_CLIENT_SECRET" ]; then
            XRAY_ARGS="--jira-xray --cloud --client-secret-auth --allow-duplicate-ids"
            echo "Publishing results to Xray (new Test Execution per run)"
          else
            echo "Xray secrets not configured: results will not be published"
          fi
          pytest -v --alluredir=reports/allure-results $MARK_ARGS $XRAY_ARGS

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results